services:
  - type: web
    name: vldst-underground
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vldst-db
          property: connectionString
      - key: WEBAPP_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: vldst-db
