services:
  - type: web
    name: vldst-underground
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: ./render_start.sh

    autoDeployTrigger: checksPass

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vldst-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: BOT_TOKEN
        sync: false

      - key: PUBLIC_URL
        value: https://vldst-underground.onrender.com

      - key: WEBAPP_URL
        value: https://vldst-underground.onrender.com/

      - key: ADMIN_URL
        value: https://vldst-underground.onrender.com/admin/

      - key: BOT_USERNAME
        value: VLDST_miniapp_bot

      - key: ADMIN_IDS
        sync: false

databases:
  - name: vldst-db
    plan: free
