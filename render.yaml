services:
  - type: web
    name: vldst-underground
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vldst-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        value: https://vldst-underground.onrender.com
      - key: WEBAPP_URL
        value: https://vldst-underground.onrender.com/
      - key: ADMIN_URL
        value: https://vldst-underground.onrender.com/admin/
      - key: BOT_USERNAME
        value: VLDST_miniapp_bot
      - key: ADMIN_IDS
        sync: false
      - key: CORS_ORIGINS
        value: https://vldst-underground.onrender.com
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: vldst-db
    plan: free
