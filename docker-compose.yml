services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vldst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vldst"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: python /app/start.py
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/vldst
      BOT_TOKEN: ${BOT_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:8000/}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8000/admin/}
      BOT_USERNAME: ${BOT_USERNAME:-vldst_bot}
      ADMIN_IDS: ${ADMIN_IDS:-}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      STARS_PROVIDER_TOKEN: ${STARS_PROVIDER_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
